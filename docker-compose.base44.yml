# Base44 sandbox/dev compose for the Yamoransa Model Lab 8 static website.
#
# The site is plain HTML/CSS/JS: no build step and no backend process, just
# files to serve. The app service bind-mounts the cloned source and serves it
# straight from disk, so editing index.html / style.css / script.js is visible
# on the next page load without any rebuild or restart.
#
# Why python:3.12-slim rather than nginx: nginx's worker process runs as an
# unprivileged user (`nginx`) and cannot traverse the bind-mounted repo root
# (mode 700 in this environment), which yields 403s. The Python image runs as
# root, so it can read the mount as-is without changing host permissions.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    # --bind 0.0.0.0 so the preview proxy can reach it; --directory serves the mount.
    command: ["python3", "-m", "http.server", "80", "--bind", "0.0.0.0", "--directory", "/app"]
    ports:
      # The user-facing preview entry point must be on host port 3000.
      - "3000:80"
    volumes:
      # Mount the cloned source as the document root (read-only).
      # NOTE: static files have no HMR; a page refresh picks up edits.
      - .:/app:ro
    healthcheck:
      # Real request for index.html (HTTP 200), not just an open port.
      test:
        - CMD-SHELL
        - python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost/", timeout=3).status == 200 else 1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: on-failure
